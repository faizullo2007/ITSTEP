<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IT-Step Course</title>
    <meta name="description" content="Курсы IT-Step: современное IT-образование для детей, подростков и взрослых. Программа курса, преподаватели и запись на обучение.">
    <meta name="theme-color" content="#f4f6fb">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">

    <!-- Тема выбирается до отрисовки страницы, чтобы не было «вспышки» светлого фона -->
    <script>
        (function () {
            var theme = 'light';
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'dark' || saved === 'light') {
                    theme = saved;
                } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    theme = 'dark';
                }
            } catch (error) {
                // хранилище недоступно — остаётся светлая тема
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app">
    <!-- Заставка: видна, пока не запустится js/app.js -->
    <div class="boot">
        <span class="boot__mark" role="status" aria-label="Загрузка"></span>
        <noscript>
            <p class="boot__note"><strong>Нужен JavaScript</strong>Сайт собран на JavaScript — включите его в настройках браузера.</p>
        </noscript>
    </div>
</div>

<!-- Подсказка, если страницу открыли двойным кликом: модули JS работают только через сервер -->
<script>
    if (location.protocol === 'file:') {
        document.querySelector('.boot').innerHTML =
            '<p class="boot__note"><strong>Откройте сайт через локальный сервер</strong>' +
            'Браузер не загружает JS-модули напрямую с диска. В WebStorm нажмите на значок браузера ' +
            'в правом верхнем углу редактора или выполните в папке проекта <code>node .claude/serve.mjs</code> ' +
            'и откройте <code>http://localhost:5173</code>.</p>';
    }
</script>

<script type="module" src="./js/app.js"></script>
</body>
</html>
